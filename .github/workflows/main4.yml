# .github/workflows/persistent-workspace.yml
#
# TEMPORARY DEBUG VARIANT: VNC auth is disabled (-SecurityTypes None).
# This is ONLY to isolate whether the "Authentication failure" was a real
# password mismatch or something upstream (websockify/tunnel) misbehaving.
# The noVNC URL is unauthenticated and reachable by anyone who has the link
# for as long as the session runs - do not leave this running unattended,
# and do not put anything sensitive in the desktop session while using it.
# Revert to password auth once we've confirmed what's actually happening.
# ---------------------------------------------------------------------------

name: Persistent Workspace kde mod (DEBUG - no VNC auth)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Start fresh or resume a snapshot?"
        type: choice
        required: true
        default: new
        options:
          - new
          - resume
      snapshot_tag:
        description: "Resume: release tag to restore. Leave empty for the newest snapshot."
        type: string
        required: false
        default: ""
      session_minutes:
        description: "How long to keep the box alive before snapshotting. Hard-capped at 240 (4h)."
        type: string
        required: false
        default: "240"
      image_size:
        description: "Disk image size (only used for mode=new). e.g. 70G"
        type: string
        required: false
        default: "70G"
      chunk_mb:
        description: "Release asset chunk size in MiB."
        type: string
        required: false
        default: "1536"
      compress_level:
        description: "zstd level for chunks. 0 = no compression (raw chunks)."
        type: string
        required: false
        default: "3"

permissions:
  contents: write

env:
  IMG: /mnt/workspace-disk/disk.img
  MNT: /snapdisk
  CHUNKDIR: /home/runner/chunks
  CONTAINER: workspace
  IDE_PORT: "8080"
  NOVNC_PORT: "6081"
  GH_TOKEN: ${{ github.token }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout (shallow, workflow metadata only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install required tools
        run: |
          set -euo pipefail
          sudo apt-get -y install zstd jq >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Resolve snapshot to restore
        id: resolve
        if: ${{ inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.snapshot_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 100 --json tagName,createdAt \
                    --jq '[.[] | select(.tagName | startswith("snap-"))]
                          | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::mode=resume but no snapshot release found."
            exit 1
          fi
          echo "Restoring from release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create fresh disk image
        if: ${{ inputs.mode == 'new' }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$(dirname "$IMG")"
          sudo truncate -s "${{ inputs.image_size }}" "$IMG"
          sudo mkfs.ext4 -F -m 0 -i 65536 -L workspace "$IMG"
          ls -lh "$IMG"; du -h --apparent-size "$IMG"; du -h "$IMG"

      - name: Restore disk image from release chunks
        if: ${{ inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          sudo mkdir -p "$(dirname "$IMG")" "$CHUNKDIR"
          sudo chown "$USER" "$(dirname "$IMG")" "$CHUNKDIR"

          gh release download "$TAG" -p manifest.json -D "$CHUNKDIR" --clobber
          MAN="$CHUNKDIR/manifest.json"
          jq . "$MAN"

          TOTAL=$(jq -r .image_bytes "$MAN")
          CHUNK_MB=$(jq -r .chunk_mb "$MAN")
          N=$(jq -r '.chunks | length' "$MAN")
          COMP=$(jq -r .compression "$MAN")

          truncate -s "$TOTAL" "$IMG"

          fetch_one() {
            local idx="$1" name="$2" sha="$3"
            local dest="$CHUNKDIR/$name"
            for try in 1 2 3; do
              rm -f "$dest"
              if gh release download "$TAG" -p "$name" -D "$CHUNKDIR" --clobber; then
                if [ "$(sha256sum "$dest" | cut -d' ' -f1)" = "$sha" ]; then
                  break
                fi
                echo "checksum mismatch on $name (attempt $try)" >&2
              fi
              [ "$try" = 3 ] && { echo "::error::failed to fetch $name"; exit 1; }
              sleep 5
            done
            local seek=$(( idx * CHUNK_MB ))
            if [ "$COMP" = "zstd" ]; then
              zstd -dc "$dest" | dd of="$IMG" bs=1M seek="$seek" \
                   conv=notrunc,sparse iflag=fullblock status=none
            else
              dd if="$dest" of="$IMG" bs=1M seek="$seek" \
                 conv=notrunc,sparse iflag=fullblock status=none
            fi
            rm -f "$dest"
            echo "restored chunk $idx/$N"
          }
          export -f fetch_one
          export TAG CHUNKDIR IMG CHUNK_MB COMP N GH_TOKEN

          jq -r '.chunks[] | "\(.index)\t\(.name)\t\(.sha256)"' "$MAN" \
            | xargs -P 4 -n 3 bash -c 'fetch_one "$0" "$1" "$2"'

          echo "Image reassembled:"; ls -lh "$IMG"; du -h "$IMG"
          sudo e2fsck -p -f "$IMG" || true

      - name: Mount image and move Docker onto it
        run: |
          set -euo pipefail
          sudo mkdir -p "$MNT"
          LOOP=$(sudo losetup --find --show "$IMG")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo mount -o discard,noatime "$LOOP" "$MNT"
          sudo mkdir -p "$MNT/docker" "$MNT/home"
          df -h "$MNT"

          sudo systemctl stop docker docker.socket containerd || true
          echo '{ "data-root": "'"$MNT"'/docker", "storage-driver": "overlay2" }' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo docker info --format 'Docker Root Dir: {{.DockerRootDir}}'

      - name: Build workspace image and (re)create container
        run: |
          set -euo pipefail
          BUILD=$(mktemp -d)

          cat > "$BUILD/entrypoint.sh" <<'EOS'
          #!/usr/bin/env bash
          set -u

          IDE_PORT=8080
          VNC_PORT=5901
          NOVNC_PORT=6081

          mkdir -p /root/.config/code-server /root/.vnc /var/log /workspace

          CFG=/root/.config/code-server/config.yaml
          if [ ! -f "$CFG" ]; then
            PW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20)
            cat > "$CFG" <<EOF
          bind-addr: 0.0.0.0:$IDE_PORT
          auth: password
          password: $PW
          cert: false
          EOF
          fi
          rm -f /tmp/tunnel_url /tmp/vnc_tunnel_url /STOP

          code-server >>/var/log/code-server.log 2>&1 &
          for _ in $(seq 1 60); do
            (echo >/dev/tcp/127.0.0.1/$IDE_PORT) >/dev/null 2>&1 && break
            sleep 1
          done

          cat > /root/.vnc/xstartup <<'EOSX'
          #!/bin/sh
          unset SESSION_MANAGER
          export XDG_CURRENT_DESKTOP="KDE"
          export XDG_SESSION_TYPE="x11"
          export XDG_RUNTIME_DIR="/tmp/xdg-runtime-root"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          export KWIN_COMPOSE=N
          export KWIN_OPENGL_INTERFACE=none
          export QT_XCB_GL_INTEGRATION=none
          exec startplasma-x11
          EOSX
          chmod +x /root/.vnc/xstartup

          # -------------------------------------------------------------
          # DEBUG: -SecurityTypes None means NO password, NO auth at all.
          # Also dropping -localhost so nothing about loopback/peer-cred
          # checks can interfere - websockify connects freely.
          # This is purely to prove whether the earlier "Authentication
          # failure" was a real credential mismatch or a websockify/Xvnc
          # negotiation issue unrelated to the password.
          # -------------------------------------------------------------
          supervise_xvnc() {
            while true; do
              pkill -9 -f 'Xvnc :1' >/dev/null 2>&1 || true
              rm -f /tmp/.X1-lock /tmp/.X11-unix/X1
              sleep 1
              Xvnc :1 \
                -geometry 1280x800 -depth 24 \
                -rfbport "$VNC_PORT" \
                -SecurityTypes None \
                -AlwaysShared -AcceptSetDesktopSize \
                -desktop devbox \
                >>/var/log/xvnc.log 2>&1
              CODE=$?
              echo "[entrypoint] Xvnc exited (code $CODE), restarting" >> /var/log/xvnc.log
              sleep 2
            done
          }
          supervise_xvnc &

          for _ in $(seq 1 30); do
            DISPLAY=:1 xdpyinfo >/dev/null 2>&1 && break
            sleep 1
          done
          export DISPLAY=:1
          dbus-launch --exit-with-session /root/.vnc/xstartup \
            >>/var/log/plasma.log 2>&1 &

          supervise_websockify() {
            while true; do
              websockify --web=/usr/share/novnc "$NOVNC_PORT" "127.0.0.1:$VNC_PORT" \
                >>/var/log/websockify.log 2>&1
              CODE=$?
              echo "[entrypoint] websockify exited (code $CODE), restarting" >> /var/log/websockify.log
              sleep 2
            done
          }
          supervise_websockify &

          supervise_tunnel() {
            local port="$1" urlfile="$2" logfile="$3"
            while true; do
              : > "$logfile"
              cloudflared tunnel --url "http://127.0.0.1:${port}" --no-autoupdate \
                --logfile "$logfile" >>"$logfile" 2>&1 &
              CF=$!
              for _ in $(seq 1 90); do
                URL=$(grep -ohE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                      "$logfile" 2>/dev/null | head -n1)
                [ -n "${URL:-}" ] && { echo "$URL" > "$urlfile"; break; }
                sleep 2
              done
              wait "$CF"
              echo "[entrypoint] cloudflared ($port) exited, restarting" >> "$logfile"
              rm -f "$urlfile"
              sleep 3
            done
          }
          supervise_tunnel "$IDE_PORT"   /tmp/tunnel_url     /var/log/cloudflared.log &
          supervise_tunnel "$NOVNC_PORT" /tmp/vnc_tunnel_url /var/log/cloudflared-vnc.log &

          wait -n
          EOS

          cat > "$BUILD/Dockerfile" <<'EOF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive SHELL=/bin/bash
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates curl wget git openssh-client sudo nano vim \
                build-essential python3 python3-pip python3-venv unzip zip \
                jq htop tmux less locales dumb-init procps psmisc \
                kde-plasma-desktop plasma-workspace kwin-x11 dolphin konsole \
                tigervnc-standalone-server tigervnc-common \
                dbus-x11 x11-xserver-utils x11-utils novnc websockify \
              && rm -rf /var/lib/apt/lists/*
          RUN curl -fsSL https://code-server.dev/install.sh | sh
          RUN arch="$(dpkg --print-architecture)" \
              && curl -fsSL -o /tmp/cf.deb \
                 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${arch}.deb" \
              && dpkg -i /tmp/cf.deb && rm /tmp/cf.deb
          RUN ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html
          COPY entrypoint.sh /usr/local/bin/entrypoint.sh
          RUN chmod +x /usr/local/bin/entrypoint.sh
          WORKDIR /workspace
          EXPOSE 8080 6081
          ENTRYPOINT ["dumb-init","--","/usr/local/bin/entrypoint.sh"]
          EOF

          sudo docker build -t workspace:latest "$BUILD"
          sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          sudo docker run -d --name "$CONTAINER" --restart unless-stopped \
            --hostname devbox \
            --shm-size=1g \
            -v "$MNT/home:/root" \
            -p 127.0.0.1:${IDE_PORT}:8080 \
            -p 127.0.0.1:${NOVNC_PORT}:6081 \
            workspace:latest

      - name: Publish connection details
        id: connect
        run: |
          set -euo pipefail
          URL=""; VNC_URL=""
          for _ in $(seq 1 90); do
            [ -z "$URL" ] && URL=$(sudo docker exec "$CONTAINER" cat /tmp/tunnel_url 2>/dev/null || true)
            [ -z "$VNC_URL" ] && VNC_URL=$(sudo docker exec "$CONTAINER" cat /tmp/vnc_tunnel_url 2>/dev/null || true)
            [ -n "$URL" ] && [ -n "$VNC_URL" ] && break
            sleep 4
          done
          PW=$(sudo docker exec "$CONTAINER" \
                 sed -n 's/^password: //p' /root/.config/code-server/config.yaml || true)
          XVNC_COUNT=$(sudo docker exec "$CONTAINER" sh -c "pgrep -fc 'Xvnc :1'" 2>/dev/null || echo 0)
          {
            echo "## 🖥️  Workspace is up (DEBUG - VNC has NO password)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| code-server URL | $URL |"
            echo "| code-server password | \`$PW\` |"
            echo "| Desktop (noVNC) URL | ${VNC_URL:+${VNC_URL}/vnc.html?resize=scale&autoconnect=1} |"
            echo "| Desktop auth | **NONE - anyone with the link can connect** |"
            echo "| Running Xvnc processes | ${XVNC_COUNT} (must be exactly 1) |"
            echo "| Mode | ${{ inputs.mode }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=NO AUTH::Desktop tunnel has no password. Debug build only."
          echo "::notice title=code-server::$URL  (password: $PW)"
          echo "::notice title=desktop (noVNC, NO AUTH)::${VNC_URL:-not ready}/vnc.html?resize=scale&autoconnect=1"

      - name: Reset stop switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/stop-signal" \
            >/dev/null 2>&1 || true

      - name: Hold the session open
        run: |
          set -uo pipefail
          REQUESTED=${{ inputs.session_minutes }}
          CAP_MINUTES=240
          MINUTES=$REQUESTED
          if [ "$MINUTES" -gt "$CAP_MINUTES" ] || [ "$MINUTES" -le 0 ]; then
            MINUTES=$CAP_MINUTES
          fi
          BUDGET=$(( MINUTES * 60 ))
          START=$(date +%s)
          while true; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            [ "$ELAPSED" -ge "$BUDGET" ] && { echo "Session budget reached."; break; }
            if sudo docker exec "$CONTAINER" test -f /STOP 2>/dev/null; then
              echo "/STOP found - wrapping up early."
              break
            fi
            if gh api "repos/${{ github.repository }}/git/refs/tags/stop-signal" >/dev/null 2>&1; then
              echo "stop-signal tag found - wrapping up early."
              break
            fi
            if ! sudo docker ps --format '{{.Names}}' | grep -qx "$CONTAINER"; then
              sudo docker start "$CONTAINER" || true
            fi
            if [ $(( ELAPSED % 600 )) -lt 30 ]; then
              printf '[%s] alive %dm/%dm\n' "$(date -u +%H:%M:%S)" $((ELAPSED/60)) $((BUDGET/60))
            fi
            sleep 30
          done

      - name: Quiesce and unmount the image
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo docker stop -t 60 "$CONTAINER" || true
          sudo fstrim -v "$MNT" || true
          sync
          sudo systemctl stop docker docker.socket containerd || true
          sudo umount "$MNT"
          sudo e2fsck -p -f "$IMG" || true

      - name: Snapshot to a new release
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$CHUNKDIR/meta"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          TAG="snap-${TS}-${{ github.run_id }}"
          CHUNK_MB=${{ inputs.chunk_mb }}
          LEVEL=${{ inputs.compress_level }}
          TOTAL=$(stat -c%s "$IMG")
          CHUNK_B=$(( CHUNK_MB * 1024 * 1024 ))
          N=$(( (TOTAL + CHUNK_B - 1) / CHUNK_B ))
          if [ "$LEVEL" -gt 0 ]; then COMP=zstd; EXT=".zst"; else COMP=none; EXT=""; fi
          PARENT=""
          [ "${{ inputs.mode }}" = "resume" ] && PARENT="${{ steps.resolve.outputs.tag }}"

          gh release create "$TAG" \
            --title "Workspace snapshot $TS" \
            --notes "Automatic workspace snapshot (debug build, no VNC auth)."

          upload_one() {
            local i="$1"
            local name; name=$(printf 'disk.part.%05d.img%s' "$i" "$EXT")
            local dest="$CHUNKDIR/$name"
            if [ "$COMP" = zstd ]; then
              sudo dd if="$IMG" bs=1M skip=$(( i * CHUNK_MB )) count="$CHUNK_MB" \
                   iflag=fullblock status=none \
                | zstd -q -T2 -"$LEVEL" -o "$dest" -f
            else
              sudo dd if="$IMG" of="$dest" bs=1M skip=$(( i * CHUNK_MB )) \
                   count="$CHUNK_MB" iflag=fullblock status=none
              sudo chown "$USER" "$dest"
            fi
            local sha size
            sha=$(sha256sum "$dest" | cut -d' ' -f1)
            size=$(stat -c%s "$dest")
            for try in 1 2 3; do
              gh release upload "$TAG" "$dest" --clobber && break
              [ "$try" = 3 ] && { echo "::error::upload failed for $name"; exit 1; }
              sleep 10
            done
            rm -f "$dest"
            jq -nc --argjson index "$i" --arg name "$name" \
                   --arg sha256 "$sha" --argjson bytes "$size" \
                   '{index:$index,name:$name,sha256:$sha256,bytes:$bytes}' \
              > "$CHUNKDIR/meta/$(printf '%05d' "$i").json"
          }
          export -f upload_one
          export IMG CHUNKDIR CHUNK_MB LEVEL COMP EXT TAG GH_TOKEN USER

          seq 0 $(( N - 1 )) | xargs -P 3 -n 1 bash -c 'upload_one "$0"'

          jq -s --arg tag "$TAG" --arg ts "$TS" --arg comp "$COMP" \
                --argjson total "$TOTAL" --argjson cmb "$CHUNK_MB" \
                --argjson level "$LEVEL" --arg parent "${PARENT:-}" \
                --arg run "${{ github.run_id }}" \
             '{schema:1, tag:$tag, created_utc:$ts, image_bytes:$total,
               chunk_mb:$cmb, compression:$comp, compression_level:$level,
               filesystem:"ext4", parent:$parent, run_id:$run,
               chunks: (. | sort_by(.index))}' \
             "$CHUNKDIR"/meta/*.json > "$CHUNKDIR/manifest.json"
          gh release upload "$TAG" "$CHUNKDIR/manifest.json" --clobber
          echo "::notice title=snapshot::$TAG"

      - name: Tear down
        if: ${{ always() }}
        run: |
          sudo umount "$MNT" 2>/dev/null || true
          [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" 2>/dev/null || true
          sudo rm -f "$IMG" || true
          df -h / /mnt || true
