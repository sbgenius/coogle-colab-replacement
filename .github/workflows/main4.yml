# .github/workflows/persistent-workspace.yml
#
# Persistent cloud dev box on GitHub Actions.
#
#   * All work lives inside ONE sparse disk-image file (ext4 on a loop device).
#   * Docker's data-root is moved onto that image, so every container, layer,
#     volume and byte you create lands inside the image.
#   * At the end of the session the image is sliced into fixed-offset chunks and
#     pushed to a brand-new GitHub Release as assets, with a manifest.
#   * Next run you pick "resume", the chunks are pulled back, the image is
#     reassembled in place, and you carry on where you left off.
#   * code-server + Cloudflare quick tunnel  -> browser IDE.
#   * KDE Plasma (Xvnc + noVNC) + its own tunnel -> full graphical desktop.
#
# ---------------------------------------------------------------------------
# PORTS (all distinct, on purpose)
#   8080  code-server        -> tunnel #1
#   5901  Xvnc raw RFB       -> loopback only, never tunnelled
#   6081  websockify/noVNC   -> tunnel #2
#
# VNC PASSWORD
#   Set via the `vnc_password` input. VNC's auth scheme hard-truncates to 8
#   characters, so only the first 8 matter - a longer value still works, you
#   just type the first 8. The passwd file is written with `echo` (vncpasswd -f
#   reads a LINE from stdin; a printf without a trailing newline yields a
#   ZERO-BYTE file, which is what produces "No password configured for VNC
#   Auth"). The file is size-checked after writing and the run fails loudly
#   if it came out empty, instead of silently handing you a broken desktop.
#
# CONTAINER LIFECYCLE
#   The container is recreated from a fresh build every run, resume included.
#   Previously a resume ran `docker start` on the container baked into the
#   snapshot, so entrypoint changes never took effect. Your data lives in
#   $MNT/home (bind-mounted to /root), not in the container layer, so
#   recreating costs nothing. Docker's layer cache is on the same disk image,
#   so the rebuild on resume is mostly cache hits.
#
# NOTE ON COMPRESSION  (please read, it matters)
#
# This workflow never makes a second copy of the image. It reads a 1.5 GiB
# window straight out of the image with dd and pipes it into zstd, so the only
# thing that ever hits the disk is the finished chunk. Peak extra disk use is a
# few hundred MB, not 75 GB.
#
# Compression is not cosmetic: mkfs scatters small metadata blocks every 128 MB,
# so a "mostly empty" image has no chunk that is byte-for-byte zero and raw
# chunking would upload the full 70 GB every session. With zstd an untouched
# chunk collapses to a few KB. Set `compress_level: 0` for raw chunks.
# ---------------------------------------------------------------------------

name: Persistent Workspace kde mod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Start fresh or resume a snapshot?"
        type: choice
        required: true
        default: new
        options:
          - new
          - resume
      snapshot_tag:
        description: "Resume: release tag to restore. Leave empty for the newest snapshot."
        type: string
        required: false
        default: ""
      vnc_password:
        description: "Desktop (VNC) password. Only the first 8 characters are used - that is a VNC protocol limit."
        type: string
        required: false
        default: "devbox123"
      session_minutes:
        description: "How long to keep the box alive before snapshotting. Hard-capped at 240 (4h) no matter what you enter here."
        type: string
        required: false
        default: "240"
      image_size:
        description: "Disk image size (only used for mode=new). e.g. 70G"
        type: string
        required: false
        default: "70G"
      chunk_mb:
        description: "Release asset chunk size in MiB."
        type: string
        required: false
        default: "1536"
      compress_level:
        description: "zstd level for chunks. 0 = no compression (raw chunks)."
        type: string
        required: false
        default: "3"

permissions:
  contents: write   # release assets, and the stop-signal git ref used by the Stop button

env:
  IMG: /mnt/workspace-disk/disk.img
  MNT: /snapdisk
  CHUNKDIR: /home/runner/chunks
  CONTAINER: workspace
  IDE_PORT: "8080"
  NOVNC_PORT: "6081"
  GH_TOKEN: ${{ github.token }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    # Session is hard-capped at 4h (see the clamp in "Hold the session open").
    # This ceiling adds ~100 min on top for setup, restore, and the
    # snapshot/upload at the end, so the backup always has room to finish.
    timeout-minutes: 340

    steps:
      # ------------------------------------------------------------------
      - name: Checkout (shallow, workflow metadata only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      - name: Install required tools
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h / /mnt
          echo "::endgroup::"
          sudo apt-get -y install zstd jq >/dev/null 2>&1 || true
          echo "::group::disk after"
          df -h / /mnt
          echo "::endgroup::"

      # ------------------------------------------------------------------
      - name: Resolve snapshot to restore
        id: resolve
        if: ${{ inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.snapshot_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 100 --json tagName,createdAt \
                    --jq '[.[] | select(.tagName | startswith("snap-"))]
                          | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::mode=resume but no snapshot release found."
            exit 1
          fi
          echo "Restoring from release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      - name: Create fresh disk image
        if: ${{ inputs.mode == 'new' }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$(dirname "$IMG")"
          # Sparse: consumes only what is actually written.
          sudo truncate -s "${{ inputs.image_size }}" "$IMG"
          # -m0   : no reserved-for-root blocks
          # -i 64K: ~1.1M inodes - plenty for node_modules etc, while keeping the
          #         inode tables small enough that snapshots stay compact
          sudo mkfs.ext4 -F -m 0 -i 65536 -L workspace "$IMG"
          ls -lh "$IMG"; du -h --apparent-size "$IMG"; du -h "$IMG"

      # ------------------------------------------------------------------
      - name: Restore disk image from release chunks
        if: ${{ inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          sudo mkdir -p "$(dirname "$IMG")" "$CHUNKDIR"
          sudo chown "$USER" "$(dirname "$IMG")" "$CHUNKDIR"

          gh release download "$TAG" -p manifest.json -D "$CHUNKDIR" --clobber
          MAN="$CHUNKDIR/manifest.json"
          jq . "$MAN"

          TOTAL=$(jq -r .image_bytes "$MAN")
          CHUNK_MB=$(jq -r .chunk_mb "$MAN")
          N=$(jq -r '.chunks | length' "$MAN")
          COMP=$(jq -r .compression "$MAN")

          # Recreate the container file as a sparse file of the exact size.
          truncate -s "$TOTAL" "$IMG"

          fetch_one() {
            local idx="$1" name="$2" sha="$3"
            local dest="$CHUNKDIR/$name"
            for try in 1 2 3; do
              rm -f "$dest"
              if gh release download "$TAG" -p "$name" -D "$CHUNKDIR" --clobber; then
                if [ "$(sha256sum "$dest" | cut -d' ' -f1)" = "$sha" ]; then
                  break
                fi
                echo "checksum mismatch on $name (attempt $try)" >&2
              fi
              [ "$try" = 3 ] && { echo "::error::failed to fetch $name"; exit 1; }
              sleep 5
            done
            local seek=$(( idx * CHUNK_MB ))
            if [ "$COMP" = "zstd" ]; then
              zstd -dc "$dest" | dd of="$IMG" bs=1M seek="$seek" \
                   conv=notrunc,sparse iflag=fullblock status=none
            else
              dd if="$dest" of="$IMG" bs=1M seek="$seek" \
                 conv=notrunc,sparse iflag=fullblock status=none
            fi
            rm -f "$dest"
            echo "restored chunk $idx/$N"
          }
          export -f fetch_one
          export TAG CHUNKDIR IMG CHUNK_MB COMP N GH_TOKEN

          # 4 at a time: downloads are the bottleneck, disk cost stays tiny.
          jq -r '.chunks[] | "\(.index)\t\(.name)\t\(.sha256)"' "$MAN" \
            | xargs -P 4 -n 3 bash -c 'fetch_one "$0" "$1" "$2"'

          echo "Image reassembled:"; ls -lh "$IMG"; du -h "$IMG"
          sudo e2fsck -p -f "$IMG" || true

      # ------------------------------------------------------------------
      - name: Mount image and move Docker onto it
        run: |
          set -euo pipefail
          sudo mkdir -p "$MNT"
          # discard => fstrim can punch holes back into the backing file,
          # so deleted data really disappears from the next snapshot.
          LOOP=$(sudo losetup --find --show "$IMG")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo mount -o discard,noatime "$LOOP" "$MNT"
          sudo mkdir -p "$MNT/docker" "$MNT/home"
          df -h "$MNT"

          sudo systemctl stop docker docker.socket containerd || true
          echo '{ "data-root": "'"$MNT"'/docker", "storage-driver": "overlay2" }' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo docker info --format 'Docker Root Dir: {{.DockerRootDir}}'

      # ------------------------------------------------------------------
      # Runs on BOTH new and resume. On resume the layer cache is already on
      # the restored disk, so this is fast - and it guarantees the container
      # actually runs the current entrypoint instead of a stale baked-in one.
      - name: Build workspace image and (re)create container
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -euo pipefail
          BUILD=$(mktemp -d)
          cat > "$BUILD/entrypoint.sh" <<'EOS'
          #!/usr/bin/env bash
          set -u

          IDE_PORT=8080
          VNC_PORT=5901
          NOVNC_PORT=6081

          mkdir -p /root/.config/code-server /root/.vnc /var/log /workspace

          CFG=/root/.config/code-server/config.yaml
          if [ ! -f "$CFG" ]; then
            PW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20)
            cat > "$CFG" <<EOF
          bind-addr: 0.0.0.0:$IDE_PORT
          auth: password
          password: $PW
          cert: false
          EOF
          fi
          rm -f /tmp/tunnel_url /tmp/vnc_tunnel_url /STOP

          code-server >>/var/log/code-server.log 2>&1 &
          # Wait for the IDE to actually listen before tunnelling to it.
          for _ in $(seq 1 60); do
            (echo >/dev/tcp/127.0.0.1/$IDE_PORT) >/dev/null 2>&1 && break
            sleep 1
          done

          # -------------------------------------------------------------
          # VNC password. Rewritten from $VNC_PASSWORD on EVERY boot, so the
          # value you typed into the workflow is always the value that works -
          # no stale password surviving inside a resumed snapshot.
          #
          # `echo`, not `printf '%s'`: vncpasswd -f reads a LINE from stdin.
          # Without the trailing newline it reads nothing and emits a ZERO-BYTE
          # file, and Xvnc then rejects every connection with "No password
          # configured for VNC Auth".
          # -------------------------------------------------------------
          VNC_PW_FILE=/root/.vnc/passwd
          VNC_PW_PLAIN=/root/.vnc/vnc_password.txt
          VNC_PW="${VNC_PASSWORD:-devbox123}"

          echo "$VNC_PW" > "$VNC_PW_PLAIN"
          echo "$VNC_PW" | vncpasswd -f > "$VNC_PW_FILE"
          chmod 600 "$VNC_PW_FILE" "$VNC_PW_PLAIN"

          # Fail loudly rather than serving a desktop nobody can log into.
          PWSIZE=$(stat -c%s "$VNC_PW_FILE" 2>/dev/null || echo 0)
          echo "[entrypoint] vnc passwd file is ${PWSIZE} bytes" >&2
          if [ "$PWSIZE" -lt 8 ]; then
            echo "[entrypoint] FATAL: vncpasswd produced an empty/short file" >&2
            echo "VNC_PASSWD_FILE_BAD" > /tmp/vnc_error
          fi

          cat > /root/.vnc/xstartup <<'EOSX'
          #!/bin/sh
          unset SESSION_MANAGER
          export XDG_CURRENT_DESKTOP="KDE"
          export XDG_SESSION_TYPE="x11"
          export XDG_RUNTIME_DIR="/tmp/xdg-runtime-root"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          # No GPU behind a VNC framebuffer - force KWin's software path
          # instead of trying (and failing) to use OpenGL compositing.
          export KWIN_COMPOSE=N
          export KWIN_OPENGL_INTERFACE=none
          export QT_XCB_GL_INTEGRATION=none
          exec startplasma-x11
          EOSX
          chmod +x /root/.vnc/xstartup

          # Clear stale locks from a crash or a restored snapshot.
          rm -f /tmp/.X1-lock /tmp/.X11-unix/X1
          pkill -f 'Xvnc :1' >/dev/null 2>&1 || true

          # Xvnc directly, NOT the `vncserver` wrapper: on Ubuntu 22.04/24.04
          # the wrapper merges its own defaults AFTER the command line and can
          # land in one-time-password mode regardless of the flags you pass.
          # -localhost: only websockify reaches raw RFB; browsers use 6081.
          Xvnc :1 \
            -geometry 1280x800 -depth 24 \
            -rfbport "$VNC_PORT" -localhost \
            -rfbauth "$VNC_PW_FILE" \
            -SecurityTypes VncAuth \
            -AlwaysShared -AcceptSetDesktopSize \
            -desktop devbox \
            >>/var/log/xvnc.log 2>&1 &

          export DISPLAY=:1
          for _ in $(seq 1 30); do
            xdpyinfo -display :1 >/dev/null 2>&1 && break
            sleep 1
          done
          dbus-launch --exit-with-session /root/.vnc/xstartup \
            >>/var/log/plasma.log 2>&1 &

          websockify --web=/usr/share/novnc "$NOVNC_PORT" "127.0.0.1:$VNC_PORT" \
            >>/var/log/websockify.log 2>&1 &

          # -------------------------------------------------------------
          # Supervise both Cloudflare quick tunnels - one for code-server,
          # one for the desktop. Quick tunnels die sometimes; restart and
          # republish the new hostname so the runner can print it.
          # -------------------------------------------------------------
          supervise_tunnel() {
            local port="$1" urlfile="$2" logfile="$3"
            while true; do
              : > "$logfile"
              cloudflared tunnel --url "http://127.0.0.1:${port}" --no-autoupdate \
                --logfile "$logfile" >>"$logfile" 2>&1 &
              CF=$!
              for _ in $(seq 1 90); do
                URL=$(grep -ohE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                      "$logfile" 2>/dev/null | head -n1)
                [ -n "${URL:-}" ] && { echo "$URL" > "$urlfile"; break; }
                sleep 2
              done
              wait "$CF"
              echo "[entrypoint] cloudflared ($port) exited, restarting" >> "$logfile"
              rm -f "$urlfile"
              sleep 3
            done
          }

          supervise_tunnel "$IDE_PORT"   /tmp/tunnel_url     /var/log/cloudflared.log &
          supervise_tunnel "$NOVNC_PORT" /tmp/vnc_tunnel_url /var/log/cloudflared-vnc.log &

          # Block forever supervising both tunnels; this keeps the
          # container (PID 1 via dumb-init) alive.
          wait -n
          EOS

          cat > "$BUILD/Dockerfile" <<'EOF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive SHELL=/bin/bash
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates curl wget git openssh-client sudo nano vim \
                build-essential python3 python3-pip python3-venv unzip zip \
                jq htop tmux less locales dumb-init procps \
                kde-plasma-desktop plasma-workspace kwin-x11 dolphin konsole \
                tigervnc-standalone-server tigervnc-common \
                dbus-x11 x11-xserver-utils x11-utils novnc websockify \
              && rm -rf /var/lib/apt/lists/*
          # code-server
          RUN curl -fsSL https://code-server.dev/install.sh | sh
          # cloudflared
          RUN arch="$(dpkg --print-architecture)" \
              && curl -fsSL -o /tmp/cf.deb \
                 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${arch}.deb" \
              && dpkg -i /tmp/cf.deb && rm /tmp/cf.deb
          # noVNC: serve vnc.html at the root URL for convenience
          RUN ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html
          COPY entrypoint.sh /usr/local/bin/entrypoint.sh
          RUN chmod +x /usr/local/bin/entrypoint.sh
          WORKDIR /workspace
          EXPOSE 8080 6081
          ENTRYPOINT ["dumb-init","--","/usr/local/bin/entrypoint.sh"]
          EOF

          sudo docker build -t workspace:latest "$BUILD"

          # Drop any container from a previous session. All real data is in
          # $MNT/home, which is bind-mounted, so nothing is lost.
          sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

          sudo docker run -d --name "$CONTAINER" --restart unless-stopped \
            --hostname devbox \
            --shm-size=1g \
            -e VNC_PASSWORD="$VNC_PASSWORD" \
            -v "$MNT/home:/root" \
            -p 127.0.0.1:${IDE_PORT}:8080 \
            -p 127.0.0.1:${NOVNC_PORT}:6081 \
            workspace:latest

      # ------------------------------------------------------------------
      - name: Publish connection details
        id: connect
        run: |
          set -euo pipefail
          URL=""; VNC_URL=""
          for _ in $(seq 1 90); do
            [ -z "$URL" ] && URL=$(sudo docker exec "$CONTAINER" cat /tmp/tunnel_url 2>/dev/null || true)
            [ -z "$VNC_URL" ] && VNC_URL=$(sudo docker exec "$CONTAINER" cat /tmp/vnc_tunnel_url 2>/dev/null || true)
            [ -n "$URL" ] && [ -n "$VNC_URL" ] && break
            sleep 4
          done

          # Surface a broken passwd file immediately instead of letting you
          # discover it by getting rejected in the browser.
          if sudo docker exec "$CONTAINER" test -f /tmp/vnc_error 2>/dev/null; then
            echo "::error::VNC password file was not written correctly - see xvnc.log below."
            sudo docker exec "$CONTAINER" ls -l /root/.vnc/ || true
            sudo docker exec "$CONTAINER" tail -n 40 /var/log/xvnc.log || true
          fi

          if [ -z "$URL" ]; then
            echo "::warning::code-server tunnel not up yet; logs follow."
            sudo docker exec "$CONTAINER" tail -n 50 /var/log/cloudflared.log || true
          fi
          if [ -z "$VNC_URL" ]; then
            echo "::warning::desktop tunnel not up yet; logs follow."
            sudo docker exec "$CONTAINER" tail -n 50 /var/log/cloudflared-vnc.log || true
            sudo docker exec "$CONTAINER" tail -n 30 /var/log/xvnc.log || true
          fi

          PW=$(sudo docker exec "$CONTAINER" \
                 sed -n 's/^password: //p' /root/.config/code-server/config.yaml || true)
          VNC_PW=$(sudo docker exec "$CONTAINER" cat /root/.vnc/vnc_password.txt 2>/dev/null || true)
          PWSIZE=$(sudo docker exec "$CONTAINER" stat -c%s /root/.vnc/passwd 2>/dev/null || echo 0)
          {
            echo "## 🖥️  Workspace is up"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| code-server URL | $URL |"
            echo "| code-server password | \`$PW\` |"
            echo "| Desktop (noVNC) URL | ${VNC_URL:+${VNC_URL}/vnc.html?resize=scale&autoconnect=1} |"
            echo "| Desktop (VNC) password | \`$VNC_PW\` (type the first 8 chars) |"
            echo "| VNC passwd file | ${PWSIZE} bytes (must be > 0) |"
            echo "| Ports | IDE 8080 · noVNC 6081 · Xvnc 5901 (internal) |"
            echo "| Mode | ${{ inputs.mode }} |"
            REQ=${{ inputs.session_minutes }}
            echo "| Session budget | $(( REQ > 240 || REQ <= 0 ? 240 : REQ )) min (requested: ${REQ}, hard cap: 240) |"
            echo ""
            echo "Run \`touch /STOP\` in a terminal inside the IDE to end the"
            echo "session early and trigger the snapshot immediately."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=code-server::$URL  (password: $PW)"
          echo "::notice title=desktop (noVNC)::${VNC_URL:-not ready}/vnc.html?resize=scale&autoconnect=1  (password: $VNC_PW)"

      # ------------------------------------------------------------------
      # Repo "variables" (gh variable set/get) can NEVER be written by the
      # built-in GITHUB_TOKEN, no matter what's in `permissions:` - that API
      # isn't in its scope list. A git ref is, since it only needs
      # `contents: write`. So the stop signal is: does refs/tags/stop-signal
      # exist? Clear any leftover one so it doesn't kill this run instantly.
      - name: Reset stop switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/stop-signal" \
            >/dev/null 2>&1 || true
          echo "Cleared any stale stop-signal tag."

      - name: Hold the session open
        run: |
          set -uo pipefail
          REQUESTED=${{ inputs.session_minutes }}
          CAP_MINUTES=240   # hard ceiling: 4 hours, no matter what was entered
          MINUTES=$REQUESTED
          if [ "$MINUTES" -gt "$CAP_MINUTES" ] || [ "$MINUTES" -le 0 ]; then
            echo "::warning::session_minutes=$REQUESTED is out of range, clamping to $CAP_MINUTES."
            MINUTES=$CAP_MINUTES
          fi
          BUDGET=$(( MINUTES * 60 ))
          START=$(date +%s)
          LAST_URL=$(sudo docker exec "$CONTAINER" cat /tmp/tunnel_url 2>/dev/null || true)
          LAST_VNC_URL=$(sudo docker exec "$CONTAINER" cat /tmp/vnc_tunnel_url 2>/dev/null || true)
          while true; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            [ "$ELAPSED" -ge "$BUDGET" ] && { echo "Session budget reached."; break; }

            if sudo docker exec "$CONTAINER" test -f /STOP 2>/dev/null; then
              echo "/STOP found inside the container - wrapping up early."
              break
            fi
            if gh api "repos/${{ github.repository }}/git/refs/tags/stop-signal" >/dev/null 2>&1; then
              echo "stop-signal tag found - wrapping up early."
              break
            fi
            if ! sudo docker ps --format '{{.Names}}' | grep -qx "$CONTAINER"; then
              echo "::warning::Container is gone, restarting it."
              sudo docker start "$CONTAINER" || true
            fi

            URL=$(sudo docker exec "$CONTAINER" cat /tmp/tunnel_url 2>/dev/null || true)
            if [ -n "$URL" ] && [ "$URL" != "$LAST_URL" ]; then
              LAST_URL="$URL"
              echo "::notice title=code-server tunnel url changed::$URL"
              echo "- New code-server tunnel URL: $URL" >> "$GITHUB_STEP_SUMMARY"
            fi

            VNC_URL=$(sudo docker exec "$CONTAINER" cat /tmp/vnc_tunnel_url 2>/dev/null || true)
            if [ -n "$VNC_URL" ] && [ "$VNC_URL" != "$LAST_VNC_URL" ]; then
              LAST_VNC_URL="$VNC_URL"
              echo "::notice title=desktop tunnel url changed::$VNC_URL"
              echo "- New desktop (noVNC) tunnel URL: ${VNC_URL}/vnc.html?resize=scale&autoconnect=1" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ $(( ELAPSED % 600 )) -lt 30 ]; then
              printf '[%s] alive %dm/%dm  ide=%s  desktop=%s\n' \
                "$(date -u +%H:%M:%S)" $((ELAPSED/60)) $((BUDGET/60)) "$LAST_URL" "$LAST_VNC_URL"
              df -h "$MNT" | tail -n1
            fi
            sleep 30
          done

      # ------------------------------------------------------------------
      # Always runs, however this job ends (timeout, cancel handled within the
      # 5-min grace window, normal completion, or an earlier failed step) - the
      # snapshot is never optional.
      - name: Quiesce and unmount the image
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo docker stop -t 60 "$CONTAINER" || true
          # Flush everything, then hand freed blocks back to the sparse file so
          # deleted data does not ride along into the snapshot.
          sudo fstrim -v "$MNT" || true
          sync
          sudo systemctl stop docker docker.socket containerd || true
          sudo umount "$MNT"
          sudo e2fsck -p -f "$IMG" || true
          echo "apparent: $(du -h --apparent-size "$IMG" | cut -f1)   on-disk: $(du -h "$IMG" | cut -f1)"

      # ------------------------------------------------------------------
      - name: Snapshot to a new release
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$CHUNKDIR/meta"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          TAG="snap-${TS}-${{ github.run_id }}"
          CHUNK_MB=${{ inputs.chunk_mb }}
          LEVEL=${{ inputs.compress_level }}
          TOTAL=$(stat -c%s "$IMG")
          CHUNK_B=$(( CHUNK_MB * 1024 * 1024 ))
          N=$(( (TOTAL + CHUNK_B - 1) / CHUNK_B ))
          if [ "$LEVEL" -gt 0 ]; then COMP=zstd; EXT=".zst"; else COMP=none; EXT=""; fi

          PARENT=""
          [ "${{ inputs.mode }}" = "resume" ] && PARENT="${{ steps.resolve.outputs.tag }}"

          gh release create "$TAG" \
            --title "Workspace snapshot $TS" \
            --notes "$(printf '%s\n' \
              "Automatic workspace snapshot." \
              "" \
              "| field | value |" \
              "|---|---|" \
              "| created (UTC) | $TS |" \
              "| image bytes | $TOTAL |" \
              "| chunk size | ${CHUNK_MB} MiB |" \
              "| chunk count | $N |" \
              "| compression | $COMP (level $LEVEL) |" \
              "| filesystem | ext4 |" \
              "| parent snapshot | ${PARENT:-none (fresh box)} |" \
              "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |" \
              "| commit | ${{ github.sha }} |" \
              "" \
              "Resume with: Run workflow -> mode=resume, snapshot_tag=$TAG")"

          upload_one() {
            local i="$1"
            local name; name=$(printf 'disk.part.%05d.img%s' "$i" "$EXT")
            local dest="$CHUNKDIR/$name"
            # Read a window straight out of the image and write ONLY the
            # finished chunk. No full-size intermediate file, ever.
            if [ "$COMP" = zstd ]; then
              sudo dd if="$IMG" bs=1M skip=$(( i * CHUNK_MB )) count="$CHUNK_MB" \
                   iflag=fullblock status=none \
                | zstd -q -T2 -"$LEVEL" -o "$dest" -f
            else
              sudo dd if="$IMG" of="$dest" bs=1M skip=$(( i * CHUNK_MB )) \
                   count="$CHUNK_MB" iflag=fullblock status=none
              sudo chown "$USER" "$dest"
            fi
            local sha size
            sha=$(sha256sum "$dest" | cut -d' ' -f1)
            size=$(stat -c%s "$dest")
            for try in 1 2 3; do
              gh release upload "$TAG" "$dest" --clobber && break
              [ "$try" = 3 ] && { echo "::error::upload failed for $name"; exit 1; }
              sleep 10
            done
            rm -f "$dest"
            jq -nc --argjson index "$i" --arg name "$name" \
                   --arg sha256 "$sha" --argjson bytes "$size" \
                   '{index:$index,name:$name,sha256:$sha256,bytes:$bytes}' \
              > "$CHUNKDIR/meta/$(printf '%05d' "$i").json"
            echo "uploaded $name ($(numfmt --to=iec "$size"))"
          }
          export -f upload_one
          export IMG CHUNKDIR CHUNK_MB LEVEL COMP EXT TAG GH_TOKEN USER

          # 3 workers: only 3 compressed chunks exist on disk at any moment.
          seq 0 $(( N - 1 )) | xargs -P 3 -n 1 bash -c 'upload_one "$0"'

          jq -s --arg tag "$TAG" --arg ts "$TS" --arg comp "$COMP" \
                --argjson total "$TOTAL" --argjson cmb "$CHUNK_MB" \
                --argjson level "$LEVEL" --arg parent "${PARENT:-}" \
                --arg run "${{ github.run_id }}" \
             '{schema:1, tag:$tag, created_utc:$ts, image_bytes:$total,
               chunk_mb:$cmb, compression:$comp, compression_level:$level,
               filesystem:"ext4", parent:$parent, run_id:$run,
               chunks: (. | sort_by(.index))}' \
             "$CHUNKDIR"/meta/*.json > "$CHUNKDIR/manifest.json"
          gh release upload "$TAG" "$CHUNKDIR/manifest.json" --clobber

          UPLOADED=$(jq '[.chunks[].bytes] | add' "$CHUNKDIR/manifest.json")
          {
            echo ""
            echo "## 💾 Snapshot saved"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Chunks: $N × ${CHUNK_MB} MiB windows, $COMP"
            echo "- Uploaded: $(numfmt --to=iec "$UPLOADED") (image is $(numfmt --to=iec "$TOTAL") virtual)"
            echo "- Resume: run this workflow with **mode=resume**, **snapshot_tag=\`$TAG\`**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=snapshot::$TAG"

      # ------------------------------------------------------------------
      - name: Tear down
        if: ${{ always() }}
        run: |
          sudo umount "$MNT" 2>/dev/null || true
          [ -n "${LOOP:-}" ] && sudo losetup -d "$LOOP" 2>/dev/null || true
          sudo rm -f "$IMG" || true
          df -h / /mnt || true
