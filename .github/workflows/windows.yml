name: Jupyter Lab on Windows

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Authtoken'
        required: true
        type: string
      jupyter_password:
        description: 'Jupyter Lab Password'
        required: true
        type: string

jobs:
  run-jupyter-lab:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlab

      - name: Install ngrok
        run: |
          choco install ngrok -y

      - name: Configure ngrok
        run: |
          ngrok config add-authtoken $env:NGROK_TOKEN
        env:
          NGROK_TOKEN: ${{ github.event.inputs.ngrok_token }}

      - name: Configure Jupyter Lab
        shell: python
        run: |
          import os
          from jupyter_server.auth import passwd
          import json
          
          password = os.environ.get("JUPYTER_PASSWORD")
          hash_str = passwd(password)
          
          config_dir = os.path.expanduser("~/.jupyter")
          os.makedirs(config_dir, exist_ok=True)
          config_path = os.path.join(config_dir, "jupyter_server_config.json")
          
          config = {
            "ServerApp": {
              "password": hash_str,
              "ip": "127.0.0.1",
              "port": 8888,
              "open_browser": False,
              "allow_root": True,
              "allow_remote_access": True
            }
          }
          
          with open(config_path, "w") as f:
              json.dump(config, f)
        env:
          JUPYTER_PASSWORD: ${{ github.event.inputs.jupyter_password }}

      - name: Start Services and Keep Alive
        shell: bash
        run: |
          echo "Starting Jupyter Lab..."
          python -m jupyter lab > jupyter.log 2>&1 &
          
          echo "Starting ngrok..."
          ngrok http 8888 --log=stdout > ngrok.log 2>&1 &
          
          max_retries=10
          retry_count=0
          url="null"
          
          while [ $retry_count -lt $max_retries ]; do
              sleep 3
              response=$(curl -s http://127.0.0.1:4040/api/tunnels || echo '{"tunnels":[]}')
              url=$(echo "$response" | jq -r '.tunnels[0].public_url // "null"')
              
              if [ "$url" != "null" ] && [ -n "$url" ]; then
                  break
              fi
              echo "Waiting for ngrok API to become available... ($retry_count/$max_retries)"
              retry_count=$((retry_count+1))
          done
          
          if [ "$url" != "null" ] && [ -n "$url" ]; then
              echo ""
              echo "=========================================================="
              echo "🌟 Jupyter Lab is successfully running!"
              echo "🔗 Access URL: $url"
              echo "🔑 Password: [Provided at workflow start]"
              echo "=========================================================="
              echo ""
          else
              echo "::error::Failed to fetch ngrok URL. Ensure ngrok started successfully."
              echo "--- ngrok.log ---"
              cat ngrok.log || true
              echo "--- jupyter.log ---"
              cat jupyter.log || true
              exit 1
          fi
          
          echo "Keeping workflow alive for 350 minutes..."
          for i in {1..35}; do
              sleep 600
              echo "Workflow running... ($((i * 10)) / 350 minutes)"
              
              if ! ps -W | grep -i ngrok > /dev/null; then
                  echo "::error::Ngrok process stopped unexpectedly!"
                  exit 1
              fi
              
              if ! netstat -an | grep 8888 | grep LISTEN > /dev/null; then
                  echo "::error::Jupyter Lab on port 8888 stopped unexpectedly!"
                  exit 1
              fi
          done
